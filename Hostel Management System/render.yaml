
services:
  - type: web
    name: smart-hostel-outpass
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DB_PATH
        value: /var/data/hostel.db
    disk:
      name: hostel-data
      mountPath: /var/data
      sizeGB: 1